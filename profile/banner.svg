<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#080b12" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Node Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>

    <radialGradient id="ambientCyan" cx="20%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="ambientPurple" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.6"/>
    </pattern>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 58px; fill: #ffffff; letter-spacing: -1.5px; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 21px; fill: #94a3b8; letter-spacing: 0.2px; }
    .tag { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #38bdf8; letter-spacing: 1.2px; text-transform: uppercase; }
    .pill-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #e2e8f0; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="400" fill="url(#bgGrad)" />
  <rect width="1200" height="400" fill="url(#gridPattern)" />

  <!-- Ambient Light Orbs -->
  <circle cx="250" cy="180" r="280" fill="url(#ambientCyan)" filter="url(#softGlow)" />
  <circle cx="950" cy="220" r="320" fill="url(#ambientPurple)" filter="url(#softGlow)" />

  <!-- Geometric Server Constellation (Right Side Decoration) -->
  <g opacity="0.65" transform="translate(760, 40)">
    <!-- Circuit / Graph Lines -->
    <path d="M 60 160 L 150 90 L 260 140 L 320 80 L 390 150 L 340 240 L 220 260 L 120 230 Z" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 4" />
    <path d="M 150 90 L 220 260" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.4" />
    <path d="M 260 140 L 120 230" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.4" />
    <path d="M 150 90 L 340 240" fill="none" stroke="#a855f7" stroke-width="1" stroke-opacity="0.3" />

    <!-- Nodes -->
    <circle cx="60" cy="160" r="6" fill="#38bdf8" filter="url(#glow)" />
    <circle cx="150" cy="90" r="8" fill="#818cf8" filter="url(#glow)" />
    <circle cx="260" cy="140" r="10" fill="#a855f7" filter="url(#glow)" />
    <circle cx="320" cy="80" r="5" fill="#38bdf8" />
    <circle cx="390" cy="150" r="7" fill="#818cf8" filter="url(#glow)" />
    <circle cx="340" cy="240" r="9" fill="#06b6d4" filter="url(#glow)" />
    <circle cx="220" cy="260" r="8" fill="#c084fc" filter="url(#glow)" />
    <circle cx="120" cy="230" r="6" fill="#38bdf8" />

    <!-- Floating Hexagon Server Cube -->
    <g transform="translate(210, 110)">
      <polygon points="50,15 90,38 90,85 50,108 10,85 10,38" fill="#0f172a" stroke="url(#primaryGrad)" stroke-width="2.5" />
      <path d="M 50 15 L 50 60 L 90 85 M 50 60 L 10 85" fill="none" stroke="url(#primaryGrad)" stroke-width="2" />
      <circle cx="50" cy="60" r="4" fill="#38bdf8" filter="url(#glow)" />
    </g>
  </g>

  <!-- Left Content Branding -->
  <g transform="translate(80, 75)">
    <!-- Brand Tag Pill -->
    <rect x="0" y="0" width="220" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="15" cy="15" r="4.5" fill="#10b981" />
    <text x="28" y="20" class="tag">OPEN SOURCE ECOSYSTEM</text>

    <!-- Main Title -->
    <g transform="translate(0, 68)">
      <!-- Gradient Logo Icon -->
      <g transform="translate(0, -38)">
        <rect x="0" y="0" width="46" height="46" rx="12" fill="url(#primaryGrad)" />
        <path d="M 14 14 L 23 32 L 32 14" fill="none" stroke="#0b0f19" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
        <circle cx="23" cy="18" r="2.5" fill="#0b0f19" />
      </g>
      <text x="60" y="0" class="title">Vexa<tspan fill="url(#primaryGrad)">Node</tspan></text>
    </g>

    <!-- Subtitle / Mission -->
    <text x="0" y="112" class="subtitle">Production-grade tools, bot frameworks &amp; infrastructure</text>
    <text x="0" y="140" class="subtitle">built for modern server owners and cloud developers.</text>

    <!-- Pills / Categories -->
    <g transform="translate(0, 185)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="168" height="36" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
        <text x="18" y="23" class="pill-text">🤖 Discord.js &amp; Python</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(180, 0)">
        <rect width="180" height="36" rx="18" fill="#1e293b" stroke="#818cf8" stroke-width="1" stroke-opacity="0.4" />
        <text x="18" y="23" class="pill-text">⚡ Minecraft Optimization</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(372, 0)">
        <rect width="165" height="36" rx="18" fill="#1e293b" stroke="#c084fc" stroke-width="1" stroke-opacity="0.4" />
        <text x="18" y="23" class="pill-text">🎛️ Pterodactyl Tools</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(549, 0)">
        <rect width="170" height="36" rx="18" fill="#1e293b" stroke="#34d399" stroke-width="1" stroke-opacity="0.4" />
        <text x="18" y="23" class="pill-text">🐳 Docker &amp; VPS Deploy</text>
      </g>
    </g>
  </g>

  <!-- Bottom Accent Stripe -->
  <rect x="0" y="396" width="1200" height="4" fill="url(#primaryGrad)" />
</svg>
