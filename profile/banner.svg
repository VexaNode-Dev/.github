<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b11" />
      <stop offset="50%" stop-color="#0d111a" />
      <stop offset="100%" stop-color="#06080d" />
    </linearGradient>

    <!-- Brand Accent Gradient -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <radialGradient id="subtleGlow" cx="15%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <pattern id="dotPattern" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1e293b" opacity="0.6" />
    </pattern>
  </defs>

  <style>
    .brand { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 46px; fill: #ffffff; letter-spacing: -1px; }
    .mono-tag { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; font-weight: 600; fill: #38bdf8; letter-spacing: 1.5px; }
    .desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 16px; fill: #94a3b8; font-weight: 400; line-height: 1.5; }
    .term-title { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #64748b; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; fill: #e2e8f0; }
    .code-dim { fill: #64748b; }
    .code-cyan { fill: #38bdf8; }
    .code-green { fill: #34d399; }
    .code-purple { fill: #c084fc; }
  </style>

  <!-- Background -->
  <rect width="1200" height="320" fill="url(#bg)" />
  <rect width="1200" height="320" fill="url(#dotPattern)" />
  <circle cx="180" cy="90" r="260" fill="url(#subtleGlow)" />

  <!-- Left Content Branding -->
  <g transform="translate(70, 60)">
    <!-- Pill Tag -->
    <g transform="translate(0, 0)">
      <rect width="180" height="24" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <circle cx="12" cy="12" r="3.5" fill="#38bdf8" />
      <text x="24" y="16" class="mono-tag">DEVELOPER TOOLS</text>
    </g>

    <!-- Main Title -->
    <g transform="translate(0, 56)">
      <text x="0" y="0" class="brand">Vexa<tspan fill="url(#brandGrad)">Node</tspan></text>
    </g>

    <!-- Description -->
    <text x="0" y="86" class="desc">Open-source infrastructure, server utilities, and starter</text>
    <text x="0" y="110" class="desc">templates built for bot developers and hosting engineers.</text>

    <!-- Metadata Badges Row -->
    <g transform="translate(0, 142)">
      <g transform="translate(0, 0)">
        <rect width="105" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="0.8" />
        <text x="12" y="17" class="code" font-size="11">MIT Licensed</text>
      </g>
      <g transform="translate(115, 0)">
        <rect width="115" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="0.8" />
        <text x="12" y="17" class="code" font-size="11">Zero Telemetry</text>
      </g>
      <g transform="translate(240, 0)">
        <rect width="110" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="0.8" />
        <text x="12" y="17" class="code" font-size="11">Docker Ready</text>
      </g>
    </g>
  </g>

  <!-- Right Side Mockup Terminal Window -->
  <g transform="translate(680, 45)">
    <!-- Terminal Box -->
    <rect width="450" height="230" rx="10" fill="#090d16" stroke="#1e293b" stroke-width="1.2" />
    <path d="M 0 34 L 450 34" stroke="#1e293b" stroke-width="1" />

    <!-- Terminal Window Dots -->
    <circle cx="18" cy="17" r="4.5" fill="#ef4444" opacity="0.8" />
    <circle cx="34" cy="17" r="4.5" fill="#f59e0b" opacity="0.8" />
    <circle cx="50" cy="17" r="4.5" fill="#10b981" opacity="0.8" />
    <text x="75" y="21" class="term-title">vexanode ~ server-diagnostics</text>

    <!-- Terminal Content Lines -->
    <g transform="translate(20, 60)">
      <text x="0" y="0" class="code"><tspan class="code-cyan">$</tspan> npx server-log-analyzer ./logs --crashes</text>
      
      <text x="0" y="24" class="code code-dim">[scan] Indexing directory: ./logs (including .log.gz)</text>
      <text x="0" y="44" class="code code-dim">[scan] Analyzed 34 archives in 42ms</text>

      <text x="0" y="74" class="code code-green">✓ No fatal OOM or watchdog thread dumps detected</text>
      <text x="0" y="94" class="code code-green">✓ Port bindings OK (25565 / 8080 active)</text>

      <text x="0" y="124" class="code code-purple">→ Recommendation: simulation-distance=4 (saved 18% CPU)</text>
      <text x="0" y="146" class="code"><tspan class="code-cyan">[vexanode.gg]</tspan> System operating within baseline</text>
    </g>
  </g>

  <!-- Bottom Line Accent -->
  <rect x="0" y="318" width="1200" height="2" fill="url(#brandGrad)" />
</svg>
